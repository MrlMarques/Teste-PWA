<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#000000">
<meta name="description" content="TaskFlow Executive - Gerenciador de Tarefas Profissional">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<title>TaskFlow Executive</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="app-container">
  <header class="app-header">
    <h1>TASKFLOW // EXEC</h1>
    <p class="subtitle">[ Sistema de Gestão e Relatórios ]</p>
  </header>

  <div id="status-bar" class="status-bar">
    <span id="connection-status">● ONLINE</span>
    <span id="task-count">SECÇÃO ATIVA</span>
  </div>

  <!-- Barra de Pesquisa em Tempo Real -->
  <div class="search-box">
    <input type="text" id="search-input" placeholder="> Pesquisar registos..." autocomplete="off">
  </div>

  <form id="task-form" class="task-form">
    <div class="input-group">
      <input type="text" id="task-input" placeholder="> Nova tarefa..." autocomplete="off" required>
      <input type="date" id="task-date" class="date-input">
      <select id="task-priority">
        <option value="low">Baixa</option>
        <option value="medium" selected>Média</option>
        <option value="high">Alta</option>
      </select>
      <button type="submit" class="btn btn-primary"><span id="btn-text">[+] INSERIR</span></button>
    </div>
  </form>

  <div class="filters">
    <button class="filter-btn active" data-filter="all">TODAS</button>
    <button class="filter-btn" data-filter="active">PENDENTES</button>
    <button class="filter-btn" data-filter="completed">CONCLUÍDAS</button>
  </div>

  <div id="task-list" class="task-list"></div>

  <div id="empty-state" class="empty-state hidden">
    <p>> Nenhum registo encontrado.</p>
    <span class="empty-hint">Insira uma tarefa para iniciar o fluxo.</span>
  </div>

  <!-- Botão de Exportar Relatório PDF -->
  <div style="margin-top: 14px;">
    <button id="btn-export" class="btn btn-secondary" style="width: 100%;">[↓] EXPORTAR RELATÓRIO PDF</button>
  </div>

  <div class="stats">
    <div class="stat-item"><span class="stat-value" id="stat-total">0</span><span class="stat-label">TOTAL</span></div>
    <div class="stat-item"><span class="stat-value" id="stat-active">0</span><span class="stat-label">PENDENTES</span></div>
    <div class="stat-item"><span class="stat-value" id="stat-completed">0</span><span class="stat-label">CONCLUÍDAS</span></div>
  </div>

  <footer class="app-footer"><p>TASKFLOW PWA // SECURE STORAGE</p></footer>
</div>

<div id="toast" class="toast"></div>
<div id="print-area" style="display: none;"></div>

<script src="js/db.js"></script>
<script src="js/app.js"></script>
</body>
</html>
